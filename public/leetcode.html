<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Document</title>
    <style>
      header {
        color: white;
        background-color: black;
        display: flex;
        flex-direction: row;
        font-size: 20px;
        padding: 20px;
        justify-content: space-between;
        text-align: center;
      }
      header span{
        margin-right: 5px;
        padding-right: 10px;
      }
        .bi-bug-fill, .bi-play-fill, .bi-cloud-arrow-up-fill, .bi-file-earmark, .bi-stars, .bi-columns-gap, .bi-gear {
          padding: 10px;
          background-color: rgb(53, 52, 52);
          border-radius: 5px;
        }
        .timer .bi-cloud-arrow-up-fill{
          color:rgb(49, 163, 49);
          padding: 10px;

           

            background-color: rgb(51, 49, 49);

        }

    </style>
  </head>

  <body>
    <header>
      <div>
        <span class="bi bi-javascript"></span>
        <span>30 Days of JavaScript</span>
        <span class="bi bi-chevron-left"></span>
        <span class="bi bi-chevron-right"></span>
      </div>

      <div>
        <span class="bi bi-bug-fill"></span>

        <span class="bi bi-play-fill"></span>

        <span class="bi bi-cloud-arrow-up-fill"> Submit </span>

        <span class="bi bi-file-earmark"></span>

        <span class="bi bi-stars"></span>

        <span class="bi bi-columns-gap"></span>

        <span class="bi bi-gear"></span>

        <span class="timer">
          <span class="bi bi-chevron-left"></span>

          <span class="bi bi-pause-fill"></span>

          <span>667:56:23</span>

          <span class="bi bi-arrow-repeat"></span>
        </span>

        <span>Register or Login</span>

        <span class="btn-premium">Premium</span>
      </div>
    </header>
  </body>
</html>
