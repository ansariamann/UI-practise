<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>

    <style>
      body {
        font-family: Arial;

        font-size: 20px;
      }

      header,
      nav,
      section,
      aside,
      footer {
        border: 1px solid black;

        padding: 10px;

        margin: 5px;
      }

      @media screen and (orientation: landscape) {
        body {
          display: grid;

          grid-template-columns: 2fr 8fr 2fr;
        }

        header {
          grid-row: 1;

          grid-column: 1/4;
        }

        nav {
          grid-row: 2;

          grid-column: 1;
        }

        section {
          grid-row: 2;

          grid-column: 2;

          height: 400px;

          background-image: url("./images/banner.jpg");

          background-size: cover;
        }

        aside {
          grid-row: 2;

          grid-column: 3;
        }

        footer {
          grid-row: 3;

          grid-column: 1/4;
        }
      }

      @media screen and (orientation: portrait) {
        body {
          display: grid;

          grid-template-columns: 12fr;
        }

        header {
          grid-row: 1;
        }

        nav {
          grid-row: 2;
        }

        section {
          grid-row: 3;

          height: 500px;

          background-image: url("./images/amazon-banner.png");

          background-size: contain;
        }

        aside {
          grid-row: 4;

          display: none;
        }

        footer {
          grid-row: 5;
        }
      }
    </style>
  </head>

  <body>
    <header>Header</header>

    <nav>Nav</nav>

    <section></section>

    <aside>Aside</aside>

    <footer>Footer</footer>
  </body>
</html>
