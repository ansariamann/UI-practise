<!DOCTYPE html>

  <head>

    <link

      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <style>
      article{
         display:flex;
        flex-direction: row;
        
      }
      .card{
        width:200px;
        height:400px;
        border: 1px solid grey;
        border-radius: 5px;
        margin:20px;
       

      }
      .card-header img{
        width: 100%;
        height: 150px;

      }
      .cardbody{
        font-size: 15px;
        text-align: center;

        
      }
      .card-title{
        font-size :30px;
        font-weight: bold;

      }
      .ratings{
        margin: 20px;

      }
      .content{
        display: flex;
        flex-direction: column;
        margin-left: -50px;
        justify-content: baseline;
        margin-bottom: 20px;
        
      }
      .content span{
        margin:2px;
      }
      .footer{
        display: grid;
        grid-template-columns: 6fr 6fr;
        position: sticky;
        bottom: 0%;
        
        
      }
      .footer span{
        padding: 10px;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;

      }
      .btnsend ,.bi-search {
      background-color: rgb(232, 232, 236);
      color: rgb(46, 35, 35);
      
      }
      

    </style>

  </head>
